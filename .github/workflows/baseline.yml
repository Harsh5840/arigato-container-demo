name: Classify intentionally outdated inventory
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm test
      - name: Explain this baseline
        run: echo 'The nginx 1.26.0 inventory is intentionally outdated. Passing static tests do not mark the image secure. The baseline image was never executed.' >> "$GITHUB_STEP_SUMMARY"
